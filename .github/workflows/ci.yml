name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  windows-sqlite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        shell: bash
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test SQLite store and ownership on Windows
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\rs-task-windows-sqlite-target
        run: >-
          cargo test --locked --features sqlite --lib
          --test task_store_contract_tests --test owner_identity_tests
