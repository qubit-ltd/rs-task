name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@5a51d1833cb6a2646b4e004c3b51d8c71c9f4401

  windows-sqlite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        shell: bash
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test SQLite query, recovery, and ownership on Windows
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\rs-task-windows-sqlite-target
        run: |
          cargo test --locked --features sqlite --test integration_tests store::sqlite_tests
          cargo test --locked --features sqlite \
            --test recovery_order_tests \
            --test sqlite_query_tests \
            --test owner_release_barrier_tests \
            --test owner_identity_tests \
            --test ownership_lifecycle_tests \
            --test recovery_bounds_tests
