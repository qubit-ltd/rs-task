[package]
name = "qubit-task"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-task"
description = "Task-oriented services built on top of qubit-executor and qubit-thread-pool"
homepage = "https://github.com/qubit-ltd/rs-task"
documentation = "https://docs.rs/qubit-task"
readme = "README.md"
keywords = ["task", "concurrent", "executor", "service"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/docs/**",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_task"
doctest = true
test = true

[dependencies]
qubit-id = "0.6"
qubit-executor = "0.8"
qubit-thread-pool = { version = "0.10", path = "../rs-thread-pool" }
qubit-function = "0.18"
thiserror = "^2.0"
