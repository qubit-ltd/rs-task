[package]
name = "qubit-task"
version = "0.11.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-task"
description = "Resource-aware asynchronous task execution service"
homepage = "https://github.com/qubit-ltd/rs-task"
documentation = "https://docs.rs/qubit-task"
readme = "README.md"
keywords = ["task", "concurrent", "executor", "service"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_task"
doctest = true
test = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[bench]]
name = "sqlite_history"
harness = false
required-features = ["sqlite"]

[dependencies]
futures = "^0.3"
fs2 = { version = "^0.4", optional = true }
parking_lot = "^0.12"
qubit-event-bus = { version = "^0.21", optional = true }
qubit-codec = { version = "^0.17", features = ["registry"] }
qubit-budget = { version = "^0.10", features = ["json"] }
qubit-id = { version = "^0.7", features = ["serde"] }
qubit-metadata = { path = "../rs-metadata", version = "^0.7", features = ["json"] }
qubit-model-id = { path = "../rs-model-metadata/model-id", version = "^0.1" }
qubit-progress = "^0.9"
qubit-spi = "^0.14"
rusqlite = { version = "^0.41", features = ["bundled"], optional = true }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1.54", features = ["rt-multi-thread", "sync", "time"] }
thiserror = "^2.0"
uuid = { version = "^1.29", features = ["v4", "serde"] }

[features]
default = []
inventory = ["qubit-spi/inventory"]
sqlite = ["dep:rusqlite", "dep:fs2"]
event-bus = ["dep:qubit-event-bus", "tokio/macros"]

[workspace]

[patch.crates-io]
qubit-event-bus = { path = "../rs-event-bus" }

[dev-dependencies]
proptest = "^1.11"
qubit-event-bus-redis = { path = "../rs-event-bus-redis", version = "^0.7" }
redis = { package = "qubit-redis", version = "=2.0.0-rc.2", default-features = false, features = ["streams"] }
tokio = { version = "^1.54", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61", features = ["Win32_Storage_FileSystem"] }
