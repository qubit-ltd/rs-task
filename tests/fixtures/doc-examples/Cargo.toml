[package]
name = "qubit-task-doc-examples"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "qubit-task-doc-examples"

[[bin]]
name = "task_service"
path = "../../../examples/task_service.rs"

[dependencies]
qubit-event-bus = { path = "../../../../rs-event-bus", version = "0.17", features = ["discovery"] }
qubit-event-bus-redis = { path = "../../../../rs-event-bus-redis", version = "0.5" }
qubit-spi = "0.13"
qubit-task = { path = "../../..", features = ["event-bus", "inventory", "sqlite"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
