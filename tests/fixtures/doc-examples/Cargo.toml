[package]
name = "qubit-task-doc-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
qubit-event-bus = "0.15.0"
qubit-event-bus-redis = { version = "0.4.0", path = "../../../../rs-event-bus-redis" }
qubit-spi = "0.13"
qubit-task = { path = "../../..", features = ["event-bus"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
