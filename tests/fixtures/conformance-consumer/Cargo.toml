[package]
name = "qubit-task-conformance-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
sqlite = ["qubit-task/sqlite"]
conformance = ["qubit-task/conformance"]

[dependencies]
qubit-task = { path = "../../..", default-features = false }
qubit-id = { version = "0.6" }
qubit-metadata = { version = "0.6.2", features = ["json"] }
qubit-model-metadata = { path = "../../../../rs-model-metadata", version = "0.1.0" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
