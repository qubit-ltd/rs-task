[package]
name = "readme-quick-start"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
qubit-task = { path = "../../.." }
qubit-codec = { version = "0.17", features = ["registry"] }
qubit-id = { version = "0.7", features = ["serde"] }
qubit-model-id = { path = "../../../../rs-model-metadata/model-id", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
