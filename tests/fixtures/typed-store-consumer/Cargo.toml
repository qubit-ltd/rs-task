[package]
name = "qubit-task-typed-store-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
sqlite = ["qubit-task/sqlite"]
typed-contract = []

[dependencies]
qubit-task = { path = "../../../", default-features = false , version = "^0.11" }
qubit-id = { version = "^0.7" }
qubit-metadata = { version = "^0.7", features = ["json"] }
qubit-model-id = { path = "../../../../rs-model-metadata/model-id", version = "^0.1" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
